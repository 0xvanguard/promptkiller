[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptkiller"
version = "5.0.0"
description = "Enterprise AI Adversarial Robustness & Compliance Assessment Suite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PromptKiller Contributors" }]
keywords = [
    "ai-safety", "red-teaming", "adversarial", "llm-evaluation",
    "mitre-atlas", "owasp-llm", "nist-ai-rmf", "compliance",
    "prompt-injection", "jailbreak", "defense-synthesis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
full = [
    "httpx>=0.25",
    "aiohttp>=3.9",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
promptkiller = "promptkiller.cli:main"

[project.urls]
Homepage = "https://0xvanguard.github.io/promptkiller/"
Repository = "https://github.com/0xvanguard/promptkiller"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/promptkiller"]
